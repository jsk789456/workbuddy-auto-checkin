name: WorkBuddy 每日自动签到

on:
  # 定时触发，一天三次，全部刻意避开整点（GitHub 整点调度队列最拥挤，
  # 延迟过大时 scheduled run 会被直接跳过，这是之前漏签的根因）。
  # 签到接口本身幂等（重复调用返回「今日已签到，无需重复领取」），
  # 所以多跑几次没有副作用，只作为漏签兜底。
  #   北京 09:17 / 15:43 / 21:07
  schedule:
    - cron: "17 1 * * *"   # 北京 09:17（早间主签）
    - cron: "43 7 * * *"   # 北京 15:43（午后兜底）
    - cron: "7 13 * * *"   # 北京 21:07（晚间最后兜底）
  # 允许在 Actions 页面手动点击运行，便于首次验证 / 补签。
  workflow_dispatch:

# 仅需读取仓库内容；令牌通过仓库 Secrets 注入，不需要额外权限。
permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 写入长效令牌（来自仓库 Secret，不落盘进仓库）
        env:
          WORKBUDDY_RT: ${{ secrets.WORKBUDDY_RT }}
        run: |
          mkdir -p ~/.workbuddy
          python3 - <<'PY'
          import json, os, time
          rt = os.environ.get("WORKBUDDY_RT", "").strip()
          if not rt:
              raise SystemExit("未配置 Secret WORKBUDDY_RT，请在仓库 Settings → Secrets 中添加")
          path = os.path.expanduser("~/.workbuddy/checkin-rt.json")
          with open(path, "w", encoding="utf-8") as f:
              json.dump({
                  "v": 1,
                  "rt": rt,
                  "source": "github-actions",
                  "saved_at": int(time.time()),
                  "version": "3.1.7",
              }, f, ensure_ascii=False, indent=2)
          os.chmod(path, 0o600)
          print("refresh-token 文件已写入（已脱敏，不打印明文）")
          PY

      - name: 执行签到 + 派猫猫旅行（通道 C，客户端不开也能签）
        id: checkin
        working-directory: ${{ github.workspace }}
        run: python3 scripts/rt_auth.py --no-notify

      # 仅当签到失败时推送提醒（未配 NOTIFY_CONFIG 则自动跳过）
      - name: 签到失败推送提醒
        if: failure() && steps.checkin.outcome == 'failure' && secrets.NOTIFY_CONFIG != ''
        env:
          NOTIFY_CONFIG: ${{ secrets.NOTIFY_CONFIG }}
        run: |
          mkdir -p ~/.workbuddy/scripts
          echo "$NOTIFY_CONFIG" > ~/.workbuddy/scripts/notify_config.json
          python3 scripts/push_message.py --title "WorkBuddy 每日签到失败" \
            --message "签到 workflow（${GITHUB_WORKFLOW} #${GITHUB_RUN_ID}）执行失败，请查看 Actions 日志" \
            || echo "推送失败，忽略"
